<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title description">
  <title id="title">Four clients, one shared ESP32-CAM stream</title>
  <desc id="description">Browser, MotionEye, Home Assistant and OctoPrint connect to the same MJPEG endpoint. The ESP32-CAM shares one captured JPEG frame between clients.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="560" height="400" rx="16" fill="#101827"/>
  <g fill="#20344d" stroke="#365370" stroke-width="2">
    <rect x="20" y="32" width="200" height="56" rx="10"/>
    <rect x="20" y="112" width="200" height="56" rx="10"/>
    <rect x="20" y="192" width="200" height="56" rx="10"/>
    <rect x="20" y="272" width="200" height="56" rx="10"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">
    <text x="120" y="68">Browser</text>
    <text x="120" y="148">MotionEye</text>
    <text x="120" y="228">Home Assistant</text>
    <text x="120" y="308">OctoPrint</text>
  </g>
  <g fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round">
    <path d="M220 60H270M220 140H270M220 220H270M220 300H270M270 60V300"/>
    <path d="M270 180H324" marker-end="url(#arrow)"/>
  </g>
  <rect x="328" y="120" width="212" height="120" rx="12" fill="#12383b" stroke="#2a7771" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="434" y="154" fill="#5eead4" font-size="23" font-weight="700">ESP32-CAM</text>
    <text x="434" y="186" fill="#f8fafc" font-size="20">Shared MJPEG</text>
    <text x="434" y="216" fill="#b9c9df" font-size="18">One JPEG frame</text>
    <text x="280" y="374" fill="#b9c9df" font-size="20">http://camera.local:81/stream</text>
  </g>
</svg>
