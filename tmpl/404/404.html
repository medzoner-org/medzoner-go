<!DOCTYPE html>
{{define "404"}}
    <html class="no-js" lang="fr">
    <head>
        <meta charset="utf-8" />
        <link rel="apple-touch-icon" sizes="76x76" href="/public/images/apple-icon.png">
        <link rel="icon" type="image/png" href="/public/images/logo-single-small.png" sizes="32x32">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <title>MedZoner.com - Page introuvable</title>
        <meta name="description" content="MedZoner.com - Page introuvable" />
        <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
        <meta name="theme-color" content="#7c3aed" />
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;700&family=Material+Icons&display=swap" />
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css">
        <link rel="stylesheet" href="/public/css/app.css"/>
    </head>
    <body class="profile-page sidebar-collapse">
    <nav class="navbar navbar-transparent navbar-color-on-scroll fixed-top navbar-expand-lg" color-on-scroll="100" id="sectionsNav">
        <div class="container">
            <div class="navbar-translate">
                <a href="/"><img style="height: 40px;" src="/public/images/logo.png" alt="WWW.MEDZONER.COM"/></a>
            </div>
        </div>
    </nav>
    <div class="page-header header-filter" data-parallax="true" style="background-image: url('/public/images/background.jpg');"></div>
    {{template "404_body" .}}
    <footer class="footer" data-background-color="black">
        <div class="container">
            <div class="copyright float-right">
                &copy;
                <script>document.write(new Date().getFullYear())</script>, made with <i class="material-icon"><img src="/public/images/skateboard.png" style="height: 20px;" alt="skateboard"/></i> by
                <a href="https://github.com/Medzoner/" target="_blank" rel="noopener">Medzoner</a>.
            </div>
        </div>
    </footer>
    <script>
        (function() {
            var navbar = document.getElementById('sectionsNav');
            if (!navbar) return;
            window.addEventListener('scroll', function() {
                if (window.scrollY > 80) { navbar.classList.add('navbar-scrolled'); }
                else { navbar.classList.remove('navbar-scrolled'); }
            }, {passive: true});
        })();
    </script>
    </body>
    </html>
{{end}}
{{define "404_body"}}
    <div class="main main-raised">
        <div class="profile-content">
            <div class="container">
                <div class="row" style="min-height: 60vh; align-items: center; justify-content: center;">
                    <div class="col-md-8 ml-auto mr-auto text-center" style="padding: 4rem 2rem;">
                        <div style="display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, rgba(124,58,237,0.1) 0%, rgba(6,182,212,0.1) 100%); margin-bottom: 2rem;">
                            <span class="material-icons" style="font-size: 3.5rem; color: #7c3aed;">explore_off</span>
                        </div>
                        <h1 style="font-size: clamp(4rem, 10vw, 7rem); font-weight: 800; background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; line-height: 1;">404</h1>
                        <h2 class="title" style="margin-top: 0; font-size: 1.5rem; color: #111827;">Page introuvable</h2>
                        <p style="font-size: 1.0625rem; color: #6b7280; margin-bottom: 2.5rem; max-width: 28rem; margin-left: auto; margin-right: auto;">
                            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
                        </p>
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="material-icons" style="font-size: 1.125rem;">home</i> Retour à l'accueil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{{end}}
