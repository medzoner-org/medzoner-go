{{define "head"}}
    <head>
        <meta charset="utf-8" />
        <link rel="apple-touch-icon" sizes="76x76" href="/public/images/apple-icon.png">
        <link rel="icon" type="image/png" href="/public/images/logo-single-small.png" sizes="32x32">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <title>{{ .PageTitle }}</title>
        <meta name="description" content="{{ .PageDescription }}" />
        <link rel="canonical" href="https://www.medzoner.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Medzoner" />
        <meta property="og:locale" content="fr_FR" />
        <meta property="og:title" content="{{ .PageTitle }}" />
        <meta property="og:description" content="{{ .PageDescription }}" />
        <meta property="og:url" content="https://www.medzoner.com/" />
        <meta property="og:image" content="https://www.medzoner.com/public/images/profile.jpg" />
        <meta property="og:image:alt" content="Mehdi Youb — développeur Go et DevOps" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="{{ .PageTitle }}" />
        <meta name="twitter:description" content="{{ .PageDescription }}" />
        <meta name="twitter:image" content="https://www.medzoner.com/public/images/profile.jpg" />
        <script type="application/ld+json">
        {"@context":"https://schema.org","@graph":[{"@type":"Person","@id":"https://www.medzoner.com/#person","name":"Mehdi Youb","url":"https://www.medzoner.com/","image":"https://www.medzoner.com/public/images/profile.jpg","jobTitle":"Développeur Go et DevOps","sameAs":["https://github.com/Medzoner","https://www.linkedin.com/in/mehdi-youb-53905210"]},{"@type":"WebSite","@id":"https://www.medzoner.com/#website","name":"Medzoner","url":"https://www.medzoner.com/","inLanguage":"fr","author":{"@id":"https://www.medzoner.com/#person"}}]}
        </script>
        <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
        <meta name="theme-color" content="#7c3aed" />
        <!-- Preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Fonts -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;700&family=Material+Icons&display=swap" />
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css">
        <!-- CSS -->
        <link rel="stylesheet" href="/public/css/app.css"/>
        <link rel="stylesheet" href="/public/css/article.css"/>
        <link href="https://cdn.rawgit.com/walchko/techno-font/v0.7.3/assets/techno-font.css" rel="stylesheet">
    </head>
{{end}}
