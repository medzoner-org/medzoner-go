{{define "footer"}}
    <footer class="footer" data-background-color="black">
        <div class="container">
            <nav class="float-left">
                <ul>
                    <li>
                        <a href="https://github.com/Medzoner" target="_blank" rel="noopener">
                            <i class="fa fa-github"></i>
                            Github
                        </a>
                    </li>
                    <li>
                        <a href="https://hub.docker.com/r/medzoner" target="_blank" rel="noopener">
                            <i class="tf-docker tf-32"></i>
                            Dockerhub
                        </a>
                    </li>
                    <li>
                        <a href="https://www.linkedin.com/in/mehdi-youb-53905210" target="_blank" rel="noopener">
                            <i class="fa fa-linkedin" aria-hidden="true"></i>
                            Linkedin
                        </a>
                    </li>
                    {{ if .TorHost }}
                    <li>
                        <a href="http://{{ .TorHost }}">
                            <img src="/public/images/technos/tor.svg" alt="tor" width="14" />
                            Thor
                        </a>
                    </li>
                    {{ end }}
                </ul>
            </nav>
            <div class="copyright float-right">
                &copy;
                <script>
                    document.write(new Date().getFullYear())
                </script>, made with <i class="material-icon"><img src="/public/images/skateboard.png" style="height: 20px;" alt="skateboard"/></i> by
                <a href="https://github.com/Medzoner/" target="_blank" rel="noopener">Medzoner</a>.
            </div>
        </div>
    </footer>
    <script>
        // Navbar scroll effect
        (function() {
            var navbar = document.getElementById('sectionsNav');
            if (!navbar) return;
            var scrollThreshold = 80;
            function onScroll() {
                if (window.scrollY > scrollThreshold) {
                    navbar.classList.add('navbar-scrolled');
                } else {
                    navbar.classList.remove('navbar-scrolled');
                }
            }
            window.addEventListener('scroll', onScroll, {passive: true});
            onScroll();
        })();

        // Burger menu toggle (mobile)
        (function() {
            var toggler = document.getElementById('navbarToggler');
            var menu = document.getElementById('navbarCollapse');
            if (!toggler || !menu) return;
            function setMenuOpen(open) {
                menu.classList.toggle('show', open);
                toggler.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            toggler.addEventListener('click', function(e) {
                e.stopPropagation();
                setMenuOpen(!menu.classList.contains('show'));
            });
            menu.addEventListener('click', function(e) {
                var link = e.target.closest('a');
                // Un lien de sous-menu (dropdown) s'ouvre sur place : il ne ferme pas le panneau.
                if (link && !link.hasAttribute('data-dropdown-toggle')) setMenuOpen(false);
            });
            document.addEventListener('click', function(e) {
                if (!menu.contains(e.target)) setMenuOpen(false);
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') setMenuOpen(false);
            });
        })();

        // Recaptcha lazy-load
        function initRecaptcha(){
            if (!document.querySelector('.g-recaptcha')) return;
            var recaptchaScript = document.createElement('script');
            recaptchaScript.type = 'text/javascript';
            recaptchaScript.src = 'https://www.google.com/recaptcha/api.js';
            recaptchaScript.id = 'google-recaptcha-js';
            document.body.appendChild(recaptchaScript);
        }
        window.addEventListener('scroll', function (){
            initRecaptcha();
        }, {once:true});

        // Sous-menus du header (Articles, Contact) — sans Bootstrap
        (function() {
            function setDropdown(dd, open) {
                dd.classList.toggle('show', open);
                // Desktop: `.dropdown-menu.show` / mobile: `.dropdown.show .dropdown-menu`
                var menu = dd.querySelector('.dropdown-menu');
                if (menu) menu.classList.toggle('show', open);
                var toggle = dd.querySelector('[data-dropdown-toggle]');
                if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            function closeAll(except) {
                document.querySelectorAll('.dropdown.show').forEach(function(dd) {
                    if (dd !== except) setDropdown(dd, false);
                });
            }
            document.querySelectorAll('[data-dropdown-toggle]').forEach(function(toggle) {
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var dd = toggle.closest('.dropdown');
                    var willOpen = !dd.classList.contains('show');
                    closeAll(dd);
                    setDropdown(dd, willOpen);
                });
            });
            document.querySelectorAll('.dropdown').forEach(function(dd) {
                // Un choix dans le sous-menu referme ce sous-menu (la navigation suit).
                dd.addEventListener('click', function(e) {
                    if (e.target.closest('.dropdown-item')) setDropdown(dd, false);
                });
            });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.dropdown')) closeAll(null);
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAll(null);
            });
        })();
    </script>
{{end}}
