  cd-coverage-report:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: medzoner-runner
    needs: [ cd-release ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: '1.26.x'
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: code-coverage-report
      - run: go install github.com/modocache/gover@latest
      - run: go install github.com/mattn/goveralls@latest
      - run: goveralls -coverprofile=cov.out -service=travis-ci -repotoken "${COVERALLS_TOKEN}";
      - name: update goreportcard
        uses: creekorful/goreportcard-action@v1.0
    env:
      COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      GOPATH: /home/runner/work/medzoner-go/go
