name: CI/CD medzoner-go

run-name: ${{ github.actor }} run pipeline 🚀

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
    paths-ignore:
      - '.vscode/**'
  pull_request:
    branches:
      - master
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6

      - name: Go setup (cache + private)
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.1
      - run: golangci-lint --version
      - run: golangci-lint -v --config .golangci/.golangci.yml --issues-exit-code 1 run ./...

  ci-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6
      - name: Go setup (cache + private)
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}
          cache-dependency-path: |
            go.sum
      - run: cp .env.github .env
      - run: make test_all
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: cov.out
          retention-days: 7
    env:
      GOPATH: /home/runner/work/medzoner-go/go

  ci-security:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6

      - name: Go setup (cache + private)
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec ./...

  cd-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    needs: [ ci-lint, ci-test ]
    steps:
      - uses: actions/checkout@v6

      - name: Go setup (cache + private)
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: make build

      - name: Docker build and push
        uses: medzoner/gomedz/.github/actions/docker-push@main
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-registry: docker.io
          docker-image: medzoner/medzoner-go
          docker-tag: ${{ github.ref_name }}-${{ github.sha }}
          docker-file: ./infra/docker/prod/Dockerfile
    env:
      GOPATH: /home/runner/work/medzoner-go/go

  cd-deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ cd-release ]
    steps:
      - uses: actions/checkout@v6
        name: GitOps - Checkout
        with:
          repository: Medzoner/medzoner-gitops
          ref: 'master'
          token: ${{ secrets.CI_JOB_TOKEN }}
          fetch-depth: 0
          path: medzoner-gitops
      - name: GitOps - Patch and push
        run: |
          git -C medzoner-gitops config user.name "medzoner"
          git -C medzoner-gitops config user.email "medzoner@medzoner.com"
          sed -i "s/  tag:.*/  tag: ${{ github.ref_name }}-${{ github.sha }}/" "medzoner-gitops/charts/medzoner/values.yaml"
          git -C medzoner-gitops commit -am "medzoner ${{ github.ref_name }}-${{ github.sha }}"
          git -C medzoner-gitops push origin master
    env:
      GIT_BRANCH: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}

  cd-coverage-report:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [ cd-release ]
    steps:
      - uses: actions/checkout@v6

      - name: Go setup (cache + private)
        uses: ./.github/actions/go-setup
        with:
          go-version: '1.26.x'
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: code-coverage-report
      - run: go install github.com/modocache/gover@latest
      - run: go install github.com/mattn/goveralls@latest
      - run: goveralls -coverprofile=cov.out -service=travis-ci -repotoken "${COVERALLS_TOKEN}";
      - name: update goreportcard
        uses: creekorful/goreportcard-action@v1.0
    env:
      COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      GOPATH: /home/runner/work/medzoner-go/go
