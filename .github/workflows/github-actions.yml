# This workflow defines the CI/CD pipeline for the Medzoner Go application.
# It includes jobs for linting, testing, security scanning, building, and deploying the application.
name: medzoner-go

run-name: Action - ${{ github.sha }}

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
    paths-ignore:
      - '.vscode/**'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      run-security:
        description: "Run the ci-security job (gosec)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-lint:
    runs-on: medzoner-runner
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c .golangci/.golangci.yml -v

  ci-test:
    runs-on: medzoner-runner
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: make test_all
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: cov.out
          retention-days: 7
    env:
      GOPATH: /home/runner/work/medzoner-go/go

  ci-security:
    if: github.event_name == 'workflow_dispatch' && inputs.run-security
    runs-on: medzoner-runner
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec ./...

  cd-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: medzoner-runner
    strategy:
      matrix:
        go-version: [ '1.26.x' ]
    needs: [ ci-lint, ci-test ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ matrix.go-version }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: make build

      - name: Docker build and push
        uses: ./.github/actions/gomedz/.github/actions/docker-push
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-registry: docker.io
          docker-image: medzoner/medzoner-go
          docker-tag: ${{ github.ref_name }}-${{ github.sha }}
          docker-file: ./infra/docker/prod/Dockerfile
    env:
      GOPATH: /home/runner/work/medzoner-go/go

