# CI/CD pipeline for the Medzoner Go application.
# Jobs: lint, test, build (parallèles) → release → (deploy).
name: medzoner-go

run-name: Action - ${{ github.sha }}

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
    paths-ignore:
      - '.vscode/**'
      - '**/*.md'
      - 'doc/**'
      - 'public/images/**'
      - 'LICENSE'
      - 'CHANGELOG'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '.vscode/**'
      - '**/*.md'
      - 'doc/**'
      - 'public/images/**'
      - 'LICENSE'
      - 'CHANGELOG'
  workflow_dispatch:
    inputs:
      run-security:
        description: "Run the ci-security job (gosec)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'

jobs:
  # Évite l'exécution dupliquée push + pull_request pour la même branche du même repo.
  ci-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: medzoner-runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c .golangci/.golangci.yml --timeout=5m
          skip-cache: false

  ci-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: medzoner-runner
    env:
      GOPATH: /home/runner/work/medzoner-go/go
      COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env

      - name: Run tests (parallel)
        run: |
          go test -count=1 -cover -coverpkg=./... -covermode=count \
                  -coverprofile=cov.out -p="$(nproc)" ./...
          go tool cover -func=cov.out | tail -n 1

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: cov.out
          retention-days: 7

      # Fusion du job cd-coverage-report dans ci-test : économise un job complet
      # (checkout + clone gomedz + setup Go) sur master.
      - name: Upload coverage to Coveralls
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.COVERALLS_TOKEN != ''
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=cov.out -service=github -repotoken "${COVERALLS_TOKEN}"

      - name: Update goreportcard
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        # Appel direct de l'API goreportcard pour éviter le pull Docker Hub
        # de creekorful/goreportcard-action (rate limit anonyme 429).
        run: |
          curl -fsSL -X POST -d "repo=github.com/${{ github.repository }}" \
            https://goreportcard.com/checks || echo "goreportcard refresh failed (non-bloquant)"

  ci-build:
    # Build des binaires en parallèle de lint/test. Le résultat est partagé avec
    # cd-release via un artefact → on évite de recompiler côté release.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: medzoner-runner
    env:
      GOPATH: /home/runner/work/medzoner-go/go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}

      - run: cp .env.github .env
      - run: make build

      - name: Upload binaries artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: medzoner-bin
          path: bin/
          retention-days: 1

  ci-security:
    if: github.event_name == 'workflow_dispatch' && inputs.run-security
    runs-on: medzoner-runner
    steps:
      - uses: actions/checkout@v6
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

  ci-vuln:
    # Scan rapide des CVEs Go (modules + stdlib). Tourne en parallèle, ne bloque pas le pipeline.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: medzoner-runner
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz
      - name: Go setup (cache + private)
        uses: ./.github/actions/gomedz/.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          gh-token: ${{ secrets.CI_JOB_TOKEN }}
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cd-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: medzoner-runner
    needs: [ ci-lint, ci-test, ci-build ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: medzoner-org/gomedz
          token: ${{ secrets.ORG_PAT }}
          path: .github/actions/gomedz

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: medzoner-bin
          path: bin/

      - name: Docker build and push
        uses: ./.github/actions/gomedz/.github/actions/docker-push
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-registry: docker.io
          docker-image: medzoner/medzoner-go
          docker-tag: ${{ github.ref_name }}-${{ github.sha }}
          docker-file: ./infra/docker/prod/Dockerfile

